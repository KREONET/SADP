apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alloy
  namespace: devtroncd
spec:
  project: default
  source:
    chart: alloy
    repoURL: https://grafana.github.io/helm-charts
    targetRevision: 1.11.1
    helm:
      valuesObject:
        controller:
          type: daemonset
          tolerations:
          - operator: Exists
          volumes:
            extra:
            - name: rke2-audit
              hostPath:
                path: /var/lib/rancher/rke2/server/logs
                type: DirectoryOrCreate
            - name: alloy-tmp
              emptyDir: {}
        image:
          pullPolicy: IfNotPresent
        configReloader:
          image:
            tag: v0.91.0
            pullPolicy: IfNotPresent
        alloy:
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            readOnlyRootFilesystem: true
          mounts:
            varlog: true
            dockercontainers: false
            extra:
            - name: rke2-audit
              mountPath: /var/lib/rancher/rke2/server/logs
              readOnly: true
            - name: alloy-tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: '1'
              memory: 512Mi
          configMap:
            create: true
            content: "// Pod 로그: Kubernetes API 로 대상 Pod 를 찾아 컨테이너 로그를 읽는다.\ndiscovery.kubernetes\
              \ \"pods\" {\n  role = \"pod\"\n}\n\ndiscovery.relabel \"pods\" {\n\
              \  targets = discovery.kubernetes.pods.targets\n  rule {\n    source_labels\
              \ = [\"__meta_kubernetes_namespace\"]\n    target_label  = \"namespace\"\
              \n  }\n  rule {\n    source_labels = [\"__meta_kubernetes_pod_name\"\
              ]\n    target_label  = \"pod\"\n  }\n  rule {\n    source_labels = [\"\
              __meta_kubernetes_pod_container_name\"]\n    target_label  = \"container\"\
              \n  }\n  rule {\n    source_labels = [\"__meta_kubernetes_namespace\"\
              , \"__meta_kubernetes_pod_name\"]\n    separator     = \"/\"\n    target_label\
              \  = \"job\"\n  }\n  // 이 노드의 Pod 만 읽는다. 노드마다 DaemonSet 이 뜨므로 중복 수집을\
              \ 막는다.\n  rule {\n    source_labels = [\"__meta_kubernetes_pod_node_name\"\
              ]\n    regex         = env(\"HOSTNAME_NODE\")\n    action        = \"\
              keep\"\n  }\n}\n\nloki.source.kubernetes \"pods\" {\n  targets    =\
              \ discovery.relabel.pods.output\n  forward_to = [loki.process.pods.receiver]\n\
              }\n\nloki.process \"pods\" {\n  stage.static_labels {\n    values =\
              \ {\n      source = \"pod\",\n    }\n  }\n  forward_to = [loki.write.default.receiver]\n\
              }\n\n// 감사 로그: control-plane 노드에만 파일이 있다. 없는 노드에서는 대상이 0개다.\nlocal.file_match\
              \ \"audit\" {\n  path_targets = [{\n    __path__ = \"/var/lib/rancher/rke2/server/logs/audit.log\"\
              ,\n  }]\n}\n\nloki.source.file \"audit\" {\n  targets    = local.file_match.audit.targets\n\
              \  forward_to = [loki.process.audit.receiver]\n}\n\nloki.process \"\
              audit\" {\n  // 감사 로그는 JSON 한 줄이다. 조회에 쓸 최소 필드만 라벨로 올린다.\n  // 라벨 카디널리티가\
              \ 커지면 Loki 성능이 급격히 나빠지므로 user 나 objectRef 는\n  // 라벨로 만들지 않고 본문에 둔 채로\
              \ 검색한다.\n  stage.json {\n    expressions = {\n      verb  = \"verb\"\
              ,\n      stage = \"stage\",\n    }\n  }\n  stage.labels {\n    values\
              \ = {\n      verb  = \"verb\",\n      stage = \"stage\",\n    }\n  }\n\
              \  stage.static_labels {\n    values = {\n      source = \"kube-audit\"\
              ,\n      job    = \"kubernetes-audit\",\n    }\n  }\n  forward_to =\
              \ [loki.write.default.receiver]\n}\n\nloki.write \"default\" {\n  endpoint\
              \ {\n    url = \"http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push\"\
              \n  }\n}\n"
          extraEnv:
          - name: HOSTNAME_NODE
            valueFrom:
              fieldRef:
                fieldPath: spec.nodeName
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
  ignoreDifferences:
  - group: apps
    kind: Deployment
    jqPathExpressions:
    - .status.terminatingReplicas
  - group: apps
    kind: ReplicaSet
    jqPathExpressions:
    - .status.terminatingReplicas
