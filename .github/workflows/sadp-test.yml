# 머지 조건: `bash ./sadp --test` 전체 통과.
#
# pre-commit과 같은 명령을 돌린다. 시험은 예제 site.env로 렌더한 fixture 사본에서 돌기 때문에
# 이 job은 사이트 site.env나 클러스터 없이 결정적으로 끝나야 한다. 이 job을 브랜치 보호의
# required status check로 지정해야 실제 머지 조건이 된다(저장소 설정에서 한 번 지정).
# Forgejo Actions도 .forgejo/workflows가 없으면 이 디렉터리를 읽는다.
name: sadp-test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Python 의존성
        run: python3 -m pip install --disable-pip-version-check pyyaml

      # helm이 없으면 render-test.sh가 실패한다. 버전은 versions.lock.yaml 고정값만 쓰고
      # 공식 checksum을 확인한 바이너리만 PATH에 올린다.
      - name: 고정 버전 helm
        run: |
          set -euo pipefail
          version=$(python3 -c 'import yaml; print(yaml.safe_load(open("versions.lock.yaml"))["delivery"]["helm"])')
          archive="helm-v${version}-linux-amd64.tar.gz"
          curl -fsSLO "https://get.helm.sh/${archive}"
          curl -fsSLO "https://get.helm.sh/${archive}.sha256sum"
          sha256sum -c "${archive}.sha256sum"
          mkdir -p "${RUNNER_TEMP}/helm"
          tar -xzf "${archive}" -C "${RUNNER_TEMP}/helm" --strip-components=1 linux-amd64/helm
          echo "${RUNNER_TEMP}/helm" >> "${GITHUB_PATH}"

      - name: 회귀 시험 전체
        env:
          # 오류 문구를 비교하는 시험이 러너 locale에 흔들리지 않게 고정한다.
          LC_ALL: C.UTF-8
        run: bash ./sadp --test
