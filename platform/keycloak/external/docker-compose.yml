# 별도 VM에서 Keycloak과 PostgreSQL을 운영한다. 클러스터에는 Service/EndpointSlice만 둔다.
# 값은 같은 디렉터리의 .env 로 주입한다. .env 는 Git에 커밋하지 않는다.
#
# TLS는 Envoy Gateway가 종단한다. 이 컨테이너는 내부망에서 HTTP만 연다.
# KEYCLOAK_BIND_ADDRESS 로 내부 NIC에 묶어 공인 NIC에 노출되지 않게 한다.
services:
  postgres:
    image: postgres:17.10-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${KC_DB_NAME:?set KC_DB_NAME}
      POSTGRES_USER: ${KC_DB_USER:?set KC_DB_USER}
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD:?set KC_DB_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - keycloak-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 20
    # DB는 컨테이너 네트워크 밖으로 내보내지 않는다. ports 를 열지 않는다.

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.2
    restart: unless-stopped
    command: ["start"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KC_HTTP_ENABLED: "true"
      KC_HTTP_PORT: "8080"
      # 클러스터 안 배포와 같은 공개 hostname 을 쓴다. issuer 가 달라지면 안 된다.
      KC_HOSTNAME: ${KC_HOSTNAME:?set KC_HOSTNAME}
      KC_PROXY_HEADERS: xforwarded
      # Envoy 가 클러스터를 나올 때의 source 대역만 신뢰한다. 보통 노드 내부망 CIDR 이다.
      KC_PROXY_TRUSTED_ADDRESSES: ${KC_PROXY_TRUSTED_ADDRESSES:?set KC_PROXY_TRUSTED_ADDRESSES}
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_CACHE: local
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_PORT: "5432"
      KC_DB_URL_DATABASE: ${KC_DB_NAME}
      KC_DB_USERNAME: ${KC_DB_USER}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USER:?set KC_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:?set KC_ADMIN_PASSWORD}
      # 내부망 VM 은 Squid 말고 밖으로 나갈 길이 없다. identity provider 의 SAML
      # metadata 를 가져오는 것은 Keycloak 의 Apache HttpClient 이고, 이 client 는
      # proxy-mappings 가 없으면 아래 환경변수로 넘어간다(DefaultHttpClientFactory:
      # "Trying to use proxy mapping from env vars"). 반대로 JVM 의 -Dhttps.proxyHost
      # 는 이 경로에 통하지 않는다. HttpURLConnection 전용이라 조용히 무시되고,
      # 관리 콘솔에는 "Error reloading keys." 와 UnknownHostException 만 남는다.
      # 프록시가 필요 없는 사이트는 EGRESS_PROXY_URL 을 비워 두면 그대로 직접 나간다.
      HTTP_PROXY: ${EGRESS_PROXY_URL:-}
      HTTPS_PROXY: ${EGRESS_PROXY_URL:-}
      NO_PROXY: ${EGRESS_NO_PROXY:-localhost,127.0.0.1}
    ports:
      # 내부 NIC에만 바인딩한다. 0.0.0.0 으로 열지 않는다.
      - "${KEYCLOAK_BIND_ADDRESS:?set KEYCLOAK_BIND_ADDRESS}:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\\nhost: localhost\\n' >&3 && cat <&3 | grep -q '\"status\": \"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 30

  keycloak-config:
    image: quay.io/keycloak/keycloak:26.7.2
    restart: "no"
    depends_on:
      keycloak:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/opt/keycloak-config/configure-default-developer.sh"]
    environment:
      KC_ADMIN_USER: ${KC_ADMIN_USER:?set KC_ADMIN_USER}
      KC_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:?set KC_ADMIN_PASSWORD}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:?set KEYCLOAK_REALM}
      KEYCLOAK_IDP_ALIAS: ${KEYCLOAK_IDP_ALIAS:?set KEYCLOAK_IDP_ALIAS}
      KEYCLOAK_SAML_SP_ENTITY_ID: ${KEYCLOAK_SAML_SP_ENTITY_ID:?set KEYCLOAK_SAML_SP_ENTITY_ID}
      KEYCLOAK_IDP_METADATA_URL: ${KEYCLOAK_IDP_METADATA_URL:?set KEYCLOAK_IDP_METADATA_URL}
      KEYCLOAK_IDP_SSO_URL: ${KEYCLOAK_IDP_SSO_URL:?set KEYCLOAK_IDP_SSO_URL}
      PORTAL_CLIENT_ID: ${PORTAL_CLIENT_ID:?set PORTAL_CLIENT_ID}
      PORTAL_POST_LOGOUT_REDIRECT_URI: ${PORTAL_POST_LOGOUT_REDIRECT_URI:?set PORTAL_POST_LOGOUT_REDIRECT_URI}
    volumes:
      - ./configure-default-developer.sh:/opt/keycloak-config/configure-default-developer.sh:ro

volumes:
  keycloak-db:
