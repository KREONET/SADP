# prometheus-community/prometheus 값. 외부 Grafana 가 읽어갈 메트릭 백엔드다.
#
# Grafana 는 클러스터 밖에 있으므로 여기서는 대시보드를 띄우지 않는다.
# Alertmanager 와 pushgateway 도 쓰지 않는다. 알림은 외부 통합 운영 쪽이 담당한다.
#
# multi에서는 워커를 우선하고 single에서는 유일한 서버의 자원을 함께 쓴다.
# 모든 이미지는 scripts/cluster/sync-external-images.sh 로 미리 배포하고 IfNotPresent 로 쓴다.

alertmanager:
  enabled: false
prometheus-pushgateway:
  enabled: false

server:
  image:
    pullPolicy: IfNotPresent
  # 워커가 없는 single에서도 Pending에 갇히지 않게 선호 조건으로 둔다.
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: DoesNotExist
  persistentVolume:
    enabled: true
    size: 20Gi
    storageClass: local-path
  retention: 15d
  resources:
    requests:
      cpu: 200m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 4Gi
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    fsGroup: 65534

configmapReload:
  prometheus:
    image:
      pullPolicy: IfNotPresent

nodeExporter:
  image:
    pullPolicy: IfNotPresent

kube-state-metrics:
  image:
    pullPolicy: IfNotPresent
