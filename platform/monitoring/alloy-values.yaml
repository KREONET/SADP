# grafana/alloy 값. Pod 로그와 Kubernetes 감사 로그를 Loki 로 보낸다.
#
# 감사 로그는 API 서버가 control-plane 노드의 파일로만 쓴다.
#   /var/lib/rancher/rke2/server/logs/audit.log   (0600 root:root)
# 그래서 이 DaemonSet 은 전 노드에 뜨되, 감사 로그 파일은 있는 노드에서만 읽힌다.
# 파일 권한 때문에 root 로 실행해야 하며 hostPath 는 readOnly 로 붙인다.
#
# 감사 로그에는 요청 본문이 들어간다(RequestResponse 레벨). Secret/ConfigMap 은 Metadata
# 레벨이라 값이 빠지지만 다른 리소스 본문은 남는다. Loki 쪽 접근 권한을 앱 로그와 같게 두면
# 안 된다(docs/external-observability.md).

controller:
  type: daemonset
  # control-plane 에도 떠야 감사 로그를 읽는다.
  tolerations:
    - operator: Exists
  volumes:
    extra:
      - name: rke2-audit
        hostPath:
          path: /var/lib/rancher/rke2/server/logs
          type: DirectoryOrCreate
      # readOnlyRootFilesystem 를 켜면 Alloy 가 /tmp/alloy 를 만들지 못해 기동에 실패한다.
      # 루트는 읽기 전용으로 두고 필요한 경로만 쓰기 가능한 emptyDir 로 내준다.
      - name: alloy-tmp
        emptyDir: {}

image:
  pullPolicy: IfNotPresent
configReloader:
  image:
    # 차트 기본값은 tag 에 digest 가 붙어 있다(v0.91.0@sha256:...). sync-external-images.sh 는
    # docker save 로 옮기는데 이 과정에서 manifest digest 가 사라져 digest 참조가 로컬에서
    # 해석되지 않는다. 그러면 워커가 registry 로 pull 을 시도하다 egress 차단에 막힌다.
    # 태그만 쓰도록 고정한다. 버전은 versions.lock.yaml 이 관리한다.
    tag: v0.91.0
    pullPolicy: IfNotPresent

alloy:
  # 감사 로그 파일이 root 전용이라 권한 상승이 필요하다. 쓰기는 하지 않는다.
  securityContext:
    runAsUser: 0
    runAsGroup: 0
    readOnlyRootFilesystem: true
  mounts:
    varlog: true
    # containerd 로그는 /var/log 아래에 있으므로 dockercontainers 는 필요 없다.
    dockercontainers: false
    extra:
      - name: rke2-audit
        mountPath: /var/lib/rancher/rke2/server/logs
        readOnly: true
      - name: alloy-tmp
        mountPath: /tmp
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi
  configMap:
    create: true
    content: |
      // Pod 로그: Kubernetes API 로 대상 Pod 를 찾아 컨테이너 로그를 읽는다.
      discovery.kubernetes "pods" {
        role = "pod"
      }

      discovery.relabel "pods" {
        targets = discovery.kubernetes.pods.targets
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
        rule {
          source_labels = ["__meta_kubernetes_namespace", "__meta_kubernetes_pod_name"]
          separator     = "/"
          target_label  = "job"
        }
        // 이 노드의 Pod 만 읽는다. 노드마다 DaemonSet 이 뜨므로 중복 수집을 막는다.
        rule {
          source_labels = ["__meta_kubernetes_pod_node_name"]
          regex         = env("HOSTNAME_NODE")
          action        = "keep"
        }
      }

      loki.source.kubernetes "pods" {
        targets    = discovery.relabel.pods.output
        forward_to = [loki.process.pods.receiver]
      }

      loki.process "pods" {
        stage.static_labels {
          values = {
            source = "pod",
          }
        }
        forward_to = [loki.write.default.receiver]
      }

      // 감사 로그: control-plane 노드에만 파일이 있다. 없는 노드에서는 대상이 0개다.
      local.file_match "audit" {
        path_targets = [{
          __path__ = "/var/lib/rancher/rke2/server/logs/audit.log",
        }]
      }

      loki.source.file "audit" {
        targets    = local.file_match.audit.targets
        forward_to = [loki.process.audit.receiver]
      }

      loki.process "audit" {
        // 감사 로그는 JSON 한 줄이다. 조회에 쓸 최소 필드만 라벨로 올린다.
        // 라벨 카디널리티가 커지면 Loki 성능이 급격히 나빠지므로 user 나 objectRef 는
        // 라벨로 만들지 않고 본문에 둔 채로 검색한다.
        stage.json {
          expressions = {
            verb  = "verb",
            stage = "stage",
          }
        }
        stage.labels {
          values = {
            verb  = "verb",
            stage = "stage",
          }
        }
        stage.static_labels {
          values = {
            source = "kube-audit",
            job    = "kubernetes-audit",
          }
        }
        forward_to = [loki.write.default.receiver]
      }

      loki.write "default" {
        endpoint {
          url = "http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push"
        }
      }

  extraEnv:
    - name: HOSTNAME_NODE
      valueFrom:
        fieldRef:
          fieldPath: spec.nodeName
