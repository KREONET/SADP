{{- if and .Values.eso.createSecretStore .Values.configuration.externalSecrets }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "app-profile.esoServiceAccount" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "app-profile.labels" . | nindent 4 }}
---
apiVersion: external-secrets.io/v1
{{- if .Values.app.group }}
kind: ClusterSecretStore
{{- else }}
kind: SecretStore
{{- end }}
metadata:
  {{- if .Values.app.group }}
  name: {{ include "app-profile.groupSecretStore" . }}
  {{- else }}
  name: openbao-{{ .Values.app.name }}
  namespace: {{ .Release.Namespace }}
  {{- end }}
  labels:
    {{- include "app-profile.labels" . | nindent 4 }}
spec:
  {{- if .Values.app.group }}
  # cluster-scoped store를 쓰되 이 AppGroup Namespace 하나에서만 참조할 수 있다.
  conditions:
    - namespaces:
        - {{ .Release.Namespace }}
  {{- end }}
  provider:
    vault:
      server: {{ .Values.platform.openbao.server | quote }}
      path: {{ .Values.platform.openbao.kvMount }}
      version: v2
      caProvider:
        type: ConfigMap
        name: {{ .Values.platform.openbao.caConfigMap }}
        {{- if .Values.app.group }}
        namespace: {{ .Values.platform.openbao.caConfigMapNamespace }}
        {{- end }}
        key: ca.crt
      auth:
        kubernetes:
          mountPath: {{ .Values.platform.openbao.authMount }}
          role: {{ include "app-profile.esoRole" . }}
          serviceAccountRef:
            name: {{ include "app-profile.esoServiceAccount" . }}
            {{- if .Values.app.group }}
            namespace: {{ .Release.Namespace }}
            {{- end }}
            audiences:
              - {{ .Values.platform.openbao.audience }}
{{- end }}
