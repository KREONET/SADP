{{- if .Values.configuration.config }}
{{- /* ConfigMap 에 민감 key 가 들어오면 렌더 단계에서 실패시킨다(CI 검사와 이중 방어) */}}
{{- range $key, $value := .Values.configuration.config }}
{{- if and (ne $key "AUTH_OIDC_TOKEN_ENDPOINT") (regexMatch "(?i)(PASSWORD|PASSWD|TOKEN|SECRET|PRIVATE_KEY|CREDENTIAL|API_KEY|ACCESS_KEY|DATABASE_URL|DB_URL|DSN|CONNECTION_STRING|AUTHORIZATION|BEARER)" $key) }}
{{ fail (printf "ConfigMap key '%s' 는 민감값이다. OpenBao + ExternalSecret 으로 이동하라" $key) }}
{{- end }}
{{- $text := printf "%v" $value -}}
{{- if regexMatch "(?i)(://[^/@:]+:[^/@]+@|-----BEGIN (RSA )?PRIVATE KEY-----|^hvs\\.|^ghp_|^github_pat_|^AKIA)" $text }}
{{ fail (printf "ConfigMap key '%s' 값은 자격증명/비밀키 형태다. OpenBao + ExternalSecret 으로 이동하라" $key) }}
{{- end }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "app-profile.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "app-profile.labels" . | nindent 4 }}
data:
{{- range $key, $value := .Values.configuration.config }}
  {{ $key }}: {{ $value | quote }}
{{- end }}
{{- end }}
