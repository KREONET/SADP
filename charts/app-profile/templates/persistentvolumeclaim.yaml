{{- if and .Values.persistence.enabled (not .Values.persistence.existingClaim) }}
{{- /*
  배포 요청 store(append-only 로그)는 재시작 후에도 남아야 한다.
  RWO 한 장 + Deployment strategy=Recreate 조합이라 동시 쓰기가 생기지 않는다.
  storageClass를 비워두면 클러스터 기본값을 쓴다("" 는 동적 프로비저닝 비활성이라
  의도치 않게 다른 뜻이 되므로, 지정하지 않으면 필드 자체를 넣지 않는다).
*/ -}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "app-profile.pvcName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "app-profile.labels" . | nindent 4 }}
  {{- if .Values.persistence.keepOnDelete }}
  annotations:
    helm.sh/resource-policy: keep
  {{- end }}
spec:
  accessModes:
    - {{ .Values.persistence.accessMode }}
  resources:
    requests:
      storage: {{ .Values.persistence.size | quote }}
  {{- with .Values.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
{{- end }}
