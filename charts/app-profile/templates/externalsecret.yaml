{{- $fullname := include "app-profile.fullname" . -}}
{{- range $es := .Values.configuration.externalSecrets }}
{{- $targetName := printf "%s-%s" $fullname $es.name -}}
{{- if and (eq $es.name "oidc-client") (eq (include "app-profile.authMode" $) "oidc") -}}
{{- /* SecurityPolicy의 clientSecretName override와 ESO가 실제로 만드는 Secret 이름을 맞춘다. */ -}}
{{- $targetName = include "app-profile.oidcSecretName" $ -}}
{{- end -}}
{{- include "app-profile.assertRemotePath" (dict "ctx" $ "path" $es.remotePath) }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $fullname }}-{{ $es.name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "app-profile.labels" $ | nindent 4 }}
spec:
  refreshInterval: 1m
  secretStoreRef:
    {{- if $.Values.app.group }}
    name: {{ include "app-profile.groupSecretStore" $ }}
    kind: ClusterSecretStore
    {{- else }}
    name: {{ $es.secretStore | quote }}
    kind: SecretStore
    {{- end }}
  target:
    name: {{ $targetName | quote }}
    creationPolicy: Owner
  data:
    {{- range $key := $es.keys }}
    {{- /*
      remoteRef.key 는 SecretStore 의 KV mount(kv) 이후 경로다.
      신규 workload policy는 인증한 ESO ServiceAccount의 Namespace/이름으로 exact
      경로를 계산한다. 기존 단일 앱의 앱별 role/path는 assertRemotePath가 정확히 한 쌍으로만
      허용하며, AppGroup과 신규 Portal 신청은 workload 경로만 사용한다.
    */}}
    - secretKey: {{ get (default (dict) $es.targetKeyMap) $key | default $key | quote }}
      remoteRef:
        key: {{ $es.remotePath | quote }}
        property: {{ $key | quote }}
    {{- end }}
{{- end }}
