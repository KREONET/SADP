{{- if .Values.platform.registry.pullSecretRemotePath }}
{{- /*
  private registry pull Secret 은 Namespace 마다 있어야 한다. Chart 가 kind: Secret 을
  직접 만들면 값이 Git 에 들어오므로(그리고 ci-guard 가 막는다) OpenBao -> ESO 로만 만든다.

  계약의 pullSecretRemotePath가 비어 있으면 이 파일은 통째로 렌더되지 않는다. 노드
  containerd로 이미지를 직접 import 하는 사이트는 pull Secret 자체가 필요 없기 때문이다.

  OpenBao 쪽 role(<esoRole>)은 포털이 AppGroup 을 만들 때 함께 부여한다. 사람이 만든
  AppGroup 이라면 docs/site-configuration.md 의 ESO role 절차를 따라야 하고, 그 전에는
  ExternalSecret 이 403 으로 재시도한다.
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "app-group.pullSecretServiceAccount" . }}
  namespace: {{ include "app-group.namespace" . }}
  labels:
    {{- include "app-group.labels" . | nindent 4 }}
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ include "app-group.pullSecretStore" . }}
  labels:
    {{- include "app-group.labels" . | nindent 4 }}
spec:
  # cluster-scoped store이지만 이 그룹 Namespace의 ExternalSecret만 참조할 수 있다.
  conditions:
    - namespaces:
        - {{ include "app-group.namespace" . }}
  provider:
    vault:
      server: {{ .Values.platform.openbao.server | quote }}
      path: {{ .Values.platform.openbao.kvMount }}
      version: v2
      caProvider:
        type: ConfigMap
        name: {{ .Values.platform.openbao.caConfigMap }}
        namespace: {{ .Values.platform.openbao.caConfigMapNamespace }}
        key: ca.crt
      auth:
        kubernetes:
          mountPath: {{ .Values.platform.openbao.authMount }}
          role: {{ include "app-group.pullSecretRole" . }}
          serviceAccountRef:
            name: {{ include "app-group.pullSecretServiceAccount" . }}
            namespace: {{ include "app-group.namespace" . }}
            audiences:
              - {{ .Values.platform.openbao.audience }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "app-group.pullSecretName" . }}
  namespace: {{ include "app-group.namespace" . }}
  labels:
    {{- include "app-group.labels" . | nindent 4 }}
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: {{ include "app-group.pullSecretStore" . }}
    kind: ClusterSecretStore
  target:
    name: {{ include "app-group.pullSecretName" . }}
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: "{{ `{{ .dockerconfig }}` }}"
  data:
    - secretKey: dockerconfig
      remoteRef:
        key: {{ .Values.platform.registry.pullSecretRemotePath }}
        property: {{ .Values.registryPullSecret.remoteKey }}
{{- end }}
