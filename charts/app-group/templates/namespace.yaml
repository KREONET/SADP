{{- include "app-group.validate" . -}}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ include "app-group.namespace" . }}
  labels:
    {{- include "app-group.labels" . | nindent 4 }}
    {{- /*
      Gateway 의 allowedRoutes selector 와 같은 label 이다. 계약에서 온 값을 그대로 쓴다.
      여기서 다른 이름을 만들면 HTTPRoute 가 Accepted 되지 않고, 원인은 Route 쪽에
      드러나지 않는다.
    */}}
    {{- toYaml .Values.platform.gateway.routeSelectorLabels | nindent 4 }}
  {{- if .Values.platform.rancher.workloadProjectId }}
  annotations:
    # Rancher project 에 넣어야 기존 app-admin/developer/viewer 권한이 이 Namespace 에도 적용된다.
    field.cattle.io/projectId: {{ .Values.platform.rancher.workloadProjectId | quote }}
  {{- end }}
