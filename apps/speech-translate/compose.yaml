services:
  speech-translate:
    build: .
    ports:
      - "${SPEECH_BIND_ADDRESS:-127.0.0.1}:${SPEECH_PORT:-8000}:8000"
    environment:
      SPEECH_API_TOKEN: ${SPEECH_API_TOKEN:?Set SPEECH_API_TOKEN in the process environment}
      SPEECH_MODEL: ${SPEECH_MODEL:-large-v3}
      SPEECH_COMPUTE_TYPE: ${SPEECH_COMPUTE_TYPE:-float16}
      SPEECH_MAX_SESSIONS: ${SPEECH_MAX_SESSIONS:-2}
      SPEECH_QUEUE_SIZE: ${SPEECH_QUEUE_SIZE:-2}
      SPEECH_SILENCE_MS: ${SPEECH_SILENCE_MS:-600}
      SPEECH_MAX_UTTERANCE_MS: ${SPEECH_MAX_UTTERANCE_MS:-6000}
      SPEECH_ALLOWED_ORIGINS: ${SPEECH_ALLOWED_ORIGINS:-}
      SPEECH_OFFLINE: ${SPEECH_OFFLINE:-false}
      HF_HUB_DISABLE_TELEMETRY: "1"
    volumes:
      - models:/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${SPEECH_GPU_ID:-0}"]
              capabilities: [gpu]
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    stop_grace_period: 45s

volumes:
  models:
