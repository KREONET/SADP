openapi: 3.1.1
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: SADP Portal API
  version: 1.0.0-prod
  summary: 서비스 카탈로그, AppProfile/AppGroup 검증, Forgejo GitOps 배포 요청 API
  description: '모든 /api/v1 엔드포인트는 포털 Keycloak 세션이 필요하다. 브라우저가 보낸

    X-Portal-User와 requester 질의값은 BFF가 신뢰하지 않으며, 세션에서 얻은 신청자를

    loopback Portal API의 X-Portal-User 헤더에 새로 넣는다. 프로세스 생존 확인용

    무인증 경로는 포털 웹 오리진의 /healthz 하나뿐이며 이 문서 범위 밖이다.


    단일 앱의 envVars에서 classification=openbao인 항목만 Secret 실제 값을 요청 중에

    받을 수 있다. 해당 값은 OpenBao에 직접 저장되고 응답, 배포 요청 저장소, Git에는

    남지 않는다. AppGroup의 services[].secretKeys는 관리자가 OpenBao에 미리 준비한

    key 이름만 받으며 실제 값은 받지 않는다.


    배포 생성은 Forgejo Actions, OCI Registry, GitOps bot 연결이 갖춰졌을 때만

    동작하며 연결 전에는 503 Problem Details를 반환한다.

    '
  contact:
    name: SADP Platform Team
servers:
- url: https://{baseDomain}
  description: 포털 오리진. baseDomain은 사이트 설정(PLATFORM_BASE_DOMAIN)으로 정해진다.
  variables:
    baseDomain:
      default: sadp.example.invalid
security:
- keycloak:
  - deployments:read
tags:
- name: System
- name: Catalog
- name: AppProfile
- name: AppGroup
- name: Deployment
paths:
  /api/v1/health:
    get:
      tags:
      - System
      operationId: getPortalHealth
      summary: 포털 API 프로세스 상태 조회
      description: 로그인 사용자용 상태 확인. 무인증 프로브는 포털 웹 오리진의 /healthz를 쓴다.
      responses:
        '200':
          description: 정상
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/catalog:
    get:
      tags:
      - Catalog
      operationId: getCatalog
      summary: 사용자 서비스, 앱 템플릿, 자원 preset 조회
      description: '구성 카탈로그에 클러스터 실시간 상태를 덧붙여 돌려준다.

        services[].status는 EndpointSlice 조회 결과이며 RBAC이 없거나 조회에 실패하면 unknown이다.

        '
      responses:
        '200':
          description: 현재 사이트 카탈로그
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Catalog'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/app-profiles/validate:
    post:
      tags:
      - AppProfile
      operationId: validateAppProfile
      summary: 배포 저장 없이 AppProfile 입력 사전검증
      description: 노출, 인증, 네트워크 정책을 독립적으로 정규화하고 배포 계획을 계산한다.
      security:
      - keycloak:
        - deployments:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppProfileInput'
            examples:
              public:
                summary: 로그인 없는 공개 앱
                value:
                  appName: paper-catalog
                  project: research
                  environment: prod
                  gitRepository: https://forgejo.example/research/paper-catalog.git
                  branch: main
                  dockerfile: Dockerfile
                  containerPort: 8080
                  exposure:
                    mode: external
                  authentication:
                    mode: none
                  networkPolicy:
                    egressMode: blocked
                  resourceSize: small
              sso:
                summary: Keycloak SSO 필수 앱
                value:
                  appName: internal-search
                  project: research
                  environment: prod
                  gitRepository: https://forgejo.example/research/internal-search.git
                  branch: main
                  dockerfile: deploy/Dockerfile
                  containerPort: 8080
                  exposure:
                    mode: external
                  authentication:
                    mode: oidc
                  networkPolicy:
                    egressMode: web
                  resourceSize: medium
              internal:
                summary: AppGroup 안에서만 접근하는 내부 전용 앱
                value:
                  appName: postgres
                  group: mobility-platform
                  project: research
                  environment: prod
                  image: docker.io/library/postgres:16
                  containerPort: 5432
                  exposure:
                    mode: internal
                  networkPolicy:
                    egressMode: blocked
                    ingress:
                      allowedApps:
                      - app: api
                        port: 5432
                  resourceSize: small
      responses:
        '200':
          description: 유효한 입력과 생성 계획. 상태 변경은 발생하지 않는다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppProfileValidation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/openapi.yaml:
    get:
      tags:
      - System
      operationId: getOpenAPIDocument
      summary: 이 OpenAPI 문서 다운로드
      responses:
        '200':
          description: OpenAPI 3.1.1 YAML
          content:
            application/yaml:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/quota-usage:
    get:
      tags:
      - Deployment
      operationId: getQuotaUsage
      summary: 로그인 사용자의 쿼터 상한과 사용량 조회
      description: 'BFF가 세션에서 넣은 X-Portal-User 신청자의 사용량만 합산한다. query fallback은 없다.

        deleted 신청과 Git 반영 전 실패는 제외한다. stopped와 Git 반영 뒤 failed/deleting은

        재시작·복구 가능 용량을 보장하기 위해 원래 replica 예약량을 계속 센다. 같은

        project/environment/group/app identity가 여러 번 나오면 가장 최근 유효 신청 한 건만 센다.

        '
      parameters:
      - $ref: '#/components/parameters/RequesterHeader'
      responses:
        '200':
          description: 현재 쿼터 상한과 사용량
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuotaUsage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/app-groups/validate:
    post:
      tags:
      - AppGroup
      operationId: validateAppGroup
      summary: Compose 또는 Git 저장소를 AppGroup 배포 계획으로 사전검증
      description: 'Compose 직접 입력 또는 같은 Forgejo의 Git 주소를 받는다. Git 주소만 주면

        기본 브랜치에서 Compose 또는 Helm Chart를 자동 탐색한다. 원본 manifest는 적용하지 않고

        서비스 하나를 기존 AppProfile 하나로 안전하게 다시 생성한다.

        서비스 하나가 AppProfile 하나가 된다. 포트를 듣는 서비스는 Deployment + Service +

        NetworkPolicy, 포트 없는 worker는 Deployment + 명시적 deny/egress NetworkPolicy가 되며,

        전체는 전용 Namespace(app-<group>) 하나에 들어간다.

        '
      security:
      - keycloak:
        - deployments:write
      parameters:
      - $ref: '#/components/parameters/RequesterHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppGroupInput'
      responses:
        '200':
          description: 서비스마다 계산된 배포 계획. 상태 변경은 발생하지 않는다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppGroupPlan'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/app-groups:
    post:
      tags:
      - AppGroup
      operationId: createAppGroup
      summary: AppGroup 배포 신청(서비스마다 배포 요청 하나)
      description: '서비스 수만큼 배포 요청을 만들고 각각 기존 단일 앱 파이프라인을 탄다.

        첫 Pull Request 에 Namespace bootstrap(charts/app-group)이 함께 들어간다.

        기존 PVC 앱을 persistence 비활성 또는 다른 mountPath로 재배포하는 요청은 데이터

        삭제를 피하기 위해 거부하며, 명시적 앱 삭제 뒤에만 새 저장 계약을 받을 수 있다.

        같은 사용자, Idempotency-Key, 본문으로 모든 서비스가 이미 만들어진 재시도는

        새 요청을 만들지 않고 기존 요청 묶음을 200으로 되돌려준다.

        '
      security:
      - keycloak:
        - deployments:write
      parameters:
      - $ref: '#/components/parameters/RequesterHeader'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppGroupInput'
      responses:
        '200':
          description: 같은 Idempotency-Key와 같은 AppGroup 본문의 완전 재시도
          headers:
            Location:
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppGroupCreated'
        '202':
          description: 생성된 배포 요청 목록
          headers:
            Location:
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppGroupCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '503':
          $ref: '#/components/responses/ForgejoUnavailable'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/deployment-requests:
    post:
      tags:
      - Deployment
      operationId: createDeploymentRequest
      summary: Forgejo 배포 Pull Request 생성 요청
      description: '요청을 영속 저장소에 먼저 기록하고 202를 돌려준 뒤, 백그라운드 워커가 Forgejo

        Pull Request를 만든다. 같은 Idempotency-Key와 같은 body로 재요청하면 새 요청을

        만들지 않고 기존 요청을 200으로 되돌려준다. body가 다르면 409다.

        Forgejo 연동이 구성되지 않은 배포에서는 503이다.

        '
      security:
      - keycloak:
        - deployments:write
      parameters:
      - $ref: '#/components/parameters/RequesterHeader'
      - $ref: '#/components/parameters/OptionalIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeploymentRequestInput'
      responses:
        '200':
          description: 같은 Idempotency-Key와 같은 body의 재요청. 새 요청을 만들지 않는다.
          headers:
            Location:
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeploymentRequest'
        '202':
          description: 요청 접수. Pull Request 생성은 백그라운드에서 이어진다.
          headers:
            Location:
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeploymentRequest'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/ForgejoUnavailable'
    get:
      tags:
      - Deployment
      operationId: listDeploymentRequests
      summary: 최근 배포 요청 목록
      description: '최신순으로 돌려준다. 조회는 Forgejo 연동 여부와 무관하게 항상 200이며,

        연동 전에는 저장된 요청이 없어 빈 목록이다.

        '
      security:
      - keycloak:
        - deployments:read
      parameters:
      - name: limit
        in: query
        required: false
        description: 기본값이자 최대값은 50이다.
        schema:
          type: integer
          minimum: 1
          maximum: 50
          default: 50
      - $ref: '#/components/parameters/RequesterHeader'
      responses:
        '200':
          description: 배포 요청 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeploymentRequestList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/deployment-requests/{requestID}:
    get:
      tags:
      - Deployment
      operationId: getDeploymentRequest
      summary: 배포 요청과 GitOps Pull Request 상태 조회
      description: '조회는 Forgejo 연동 여부와 무관하게 저장소를 읽는다. 없는 id는 404다.

        '
      security:
      - keycloak:
        - deployments:read
      parameters:
      - name: requestID
        in: path
        required: true
        description: 생성 응답의 id. 16자리 소문자 16진수다.
        schema:
          type: string
          pattern: ^[0-9a-f]{16}$
      - $ref: '#/components/parameters/RequesterHeader'
      responses:
        '200':
          description: 배포 요청 상태
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeploymentRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
      - Deployment
      operationId: deleteDeploymentRequest
      summary: 내가 만든 애플리케이션 삭제
      description: '세션 신청자와 요청 소유자가 일치하고 같은 앱의 최신 요청일 때만 삭제한다.

        GitOps values/Application을 자동 승인 PR로 제거한 뒤 Argo CD가 해당 앱 리소스를

        cascade 삭제한다. AppGroup의 마지막 앱이면 Namespace bootstrap도 함께 제거한다.

        원본 source repository와 registry image 이력은 보존한다.

        '
      security:
      - keycloak:
        - deployments:write
      parameters:
      - name: requestID
        in: path
        required: true
        schema:
          type: string
          pattern: ^[0-9a-f]{16}$
      - $ref: '#/components/parameters/RequesterHeader'
      responses:
        '200':
          description: 이미 삭제된 요청의 멱등 응답
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeploymentRequest'
        '202':
          description: 소유권 확인 완료, 비동기 GitOps/Argo 삭제 시작
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeploymentRequest'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ForgejoUnavailable'
  /api/v1/deployment-requests/{requestID}/runtime-state:
    put:
      tags:
      - Deployment
      operationId: updateDeploymentRuntimeState
      summary: 내가 만든 애플리케이션 중지 또는 재개
      description: '세션 신청자와 요청 소유자가 일치하고 같은 앱의 최신 요청일 때만 실행 상태를 바꾼다.

        중지는 GitOps values의 replicaCount를 0으로 만들고 외부 HTTPRoute를 내리되 Service와

        PVC는 보존한다. 재개는 신청에 저장된 원래 replica 수와 외부 노출을 복원한다.

        kubectl scale을 직접 호출하지 않으므로 Argo CD selfHeal과 충돌하지 않는다.

        '
      security:
      - keycloak:
        - deployments:write
      parameters:
      - name: requestID
        in: path
        required: true
        schema:
          type: string
          pattern: ^[0-9a-f]{16}$
      - $ref: '#/components/parameters/RequesterHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuntimeStateInput'
      responses:
        '200':
          description: 이미 목표 상태이거나 같은 전환이 완료된 멱등 응답
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeploymentRequest'
        '202':
          description: 소유권 확인 완료, 비동기 GitOps 중지 또는 재개 시작
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeploymentRequest'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ForgejoUnavailable'
components:
  securitySchemes:
    keycloak:
      type: oauth2
      description: 'Keycloak platform realm의 포털 세션. BFF는 정확한 deployments:* client
        scope를

        우선 지원하며 현재 bootstrap 역할도 호환한다. 조회는 platform-admin, app-admin,

        developer, viewer를, 변경은 platform-admin, app-admin, developer를 허용한다.

        viewer와 deployments:read만 가진 세션은 변경 요청을 수행할 수 없다.

        '
      flows:
        authorizationCode:
          authorizationUrl: https://sso.sadp.example.invalid/realms/sadp/protocol/openid-connect/auth
          tokenUrl: https://sso.sadp.example.invalid/realms/sadp/protocol/openid-connect/token
          scopes:
            deployments:read: 자신의 배포 요청 조회
            deployments:write: 배포 요청 생성
  parameters:
    RequesterHeader:
      name: X-Portal-User
      in: header
      required: true
      x-sadp-injected-by: portal-bff
      description: 'Portal BFF가 인증 세션의 preferred_username(없으면 subject)으로 채우는 내부 신원이다.

        브라우저가 보낸 같은 이름의 헤더와 requester 질의 파라미터는 BFF가 버린다.

        loopback Go API는 이 헤더만 신뢰하며 query fallback은 제공하지 않는다.

        '
      schema:
        type: string
        minLength: 1
        maxLength: 128
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 클라이언트가 만든 1~128자 불투명 값. 같은 사용자와 같은 body 재시도에 재사용한다.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: ^[A-Za-z0-9._:-]+$
    OptionalIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: '단일 앱 요청의 선택적 멱등 키. 보내면 같은 사용자와 같은 body 재시도에 같은 값을

        재사용한다. OpenBao Secret 값을 포함한 단일 앱과 AppGroup 생성에서는 필수다. Secret 값은

        지문이나 PVC에 저장되지 않으며 OpenBao 쓰기가 실패한 재시도에서만 다시 입력한다.

        '
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: ^[A-Za-z0-9._:-]+$
  responses:
    BadRequest:
      description: JSON 구문, 알 수 없는 필드 또는 요청 형식 오류
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PayloadTooLarge:
      description: 64 KiB 요청 제한 초과
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnsupportedMediaType:
      description: Content-Type이 application/json이 아님
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ValidationError:
      description: 필드 의미 검증 실패
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: 유효한 Keycloak access token 없음
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: 요청한 project 또는 작업 권한 없음
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: 같은 앱 이름 또는 불일치하는 Idempotency-Key 재사용
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: 요청을 찾을 수 없거나 조회 권한 없음
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InternalError:
      description: 상태 저장 또는 내부 처리 실패
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ForgejoUnavailable:
      description: Forgejo 연동 전 또는 일시 장애
      headers:
        Retry-After:
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Health:
      type: object
      additionalProperties: false
      required:
      - status
      - service
      - version
      properties:
        status:
          type: string
          const: ok
        service:
          type: string
          const: portal-lite
        version:
          type: string
    Catalog:
      type: object
      additionalProperties: false
      required:
      - apiVersion
      - zone
      - autoApprove
      - environment
      - baseDomain
      - forgejoConnected
      - submissionEnabled
      - services
      - templates
      - projects
      - resourcePresets
      - userQuota
      - maxReplicas
      - openapiSpec
      - secretInputAllowed
      - appGroups
      properties:
        apiVersion:
          type: string
          const: v1
        zone:
          type: object
          additionalProperties: false
          required:
          - id
          - label
          properties:
            id:
              type: string
              description: 기존 단일 앱이 함께 배포되는 Kubernetes Namespace. AppGroup은 별도 Namespace를
                쓴다.
            label:
              type: string
              description: 화면에 표시하는 Zone 이름
        autoApprove:
          type: boolean
          description: PR 자동 병합과 빌드·배포 파이프라인 활성 여부
        environment:
          type: string
          description: 배포 환경 이름. PLATFORM_APP_ENV로 정해진다.
        baseDomain:
          type: string
          description: 사이트 기본 도메인. PLATFORM_BASE_DOMAIN으로 정해진다.
        forgejoConnected:
          type: boolean
          description: Forgejo 클라이언트 구성 여부
        submissionEnabled:
          type: boolean
          description: 배포 요청 저장소와 Forgejo가 모두 준비되어 신청이 가능한지 여부
        secretInputAllowed:
          type: boolean
          description: OpenBao 연결이 준비되어 포털에서 신규 앱 Secret을 저장할 수 있는지 여부
        openapiSpec:
          type: string
          format: uri-reference
        services:
          type: array
          items:
            $ref: '#/components/schemas/Service'
        templates:
          type: array
          items:
            $ref: '#/components/schemas/Template'
        projects:
          type: array
          description: 신청이 허용된 프로젝트 목록. PORTAL_ALLOWED_PROJECTS로 정해지며 위자드 선택지의 단일
            출처다.
          items:
            type: string
        resourcePresets:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/ResourcePreset'
        userQuota:
          $ref: '#/components/schemas/UserQuota'
        maxReplicas:
          type: integer
          description: 앱 하나가 만들 수 있는 Pod 수 상한
        appGroups:
          $ref: '#/components/schemas/CatalogAppGroups'
    CatalogAppGroups:
      type: object
      additionalProperties: false
      required:
      - enabled
      - namespacePrefix
      - maxServices
      - exposureModes
      - authenticationModes
      - egressModes
      properties:
        enabled:
          type: boolean
          description: Compose/AppGroup 신청 화면 활성 여부
        namespacePrefix:
          type: string
          description: 그룹 이름 앞에 붙어 실제 Kubernetes Namespace를 이루는 접두사
        maxServices:
          type: integer
          minimum: 1
          description: Compose 한 문서에 허용하는 최대 서비스 수
        exposureModes:
          type: array
          items:
            type: string
            enum:
            - external
            - internal
        authenticationModes:
          type: array
          items:
            type: string
            enum:
            - none
            - oidc
        egressModes:
          type: array
          items:
            type: string
            enum:
            - blocked
            - web
            - custom
    UserQuota:
      type: object
      additionalProperties: false
      required:
      - cpu
      - memory
      properties:
        cpu:
          type: string
          description: 사용자당 CPU 상한. 네임스페이스 ResourceQuota와 같은 값이다.
        memory:
          type: string
          description: 사용자당 메모리 상한. 네임스페이스 ResourceQuota와 같은 값이다.
    QuotaSummary:
      type: object
      additionalProperties: false
      required:
      - limit
      - usedCpu
      - usedMemory
      properties:
        limit:
          $ref: '#/components/schemas/UserQuota'
        usedCpu:
          type: string
          description: 이 프로필 또는 AppGroup 전체가 replicas를 포함해 사용하는 CPU limit 합계
        usedMemory:
          type: string
          description: 이 프로필 또는 AppGroup 전체가 replicas를 포함해 사용하는 memory limit 합계
    QuotaUsage:
      type: object
      additionalProperties: false
      required:
      - requester
      - limit
      - limitCpuMilli
      - limitMemoryBytes
      - used
      - usedCpuMilli
      - usedMemoryBytes
      - applications
      - pods
      properties:
        requester:
          type: string
          description: BFF가 인증 세션에서 주입해 사용량을 합산한 사용자
        limit:
          $ref: '#/components/schemas/UserQuota'
        limitCpuMilli:
          type: integer
          format: int64
          description: 상한 CPU(millicore). UI 비교용 정규화 값이다.
        limitMemoryBytes:
          type: integer
          format: int64
          description: 상한 메모리(byte)
        used:
          $ref: '#/components/schemas/UserQuota'
        usedCpuMilli:
          type: integer
          format: int64
          description: 실행 중이거나 재시작·복구를 위해 예약한 CPU(millicore)
        usedMemoryBytes:
          type: integer
          format: int64
          description: 실행 중이거나 재시작·복구를 위해 예약한 메모리(byte)
        applications:
          type: integer
          description: 사용량에 포함된 앱 수
        pods:
          type: integer
          description: 실행 중이거나 재시작을 위해 예약한 Pod 수(원래 replicas 합). stopped의 실제 Pod는
            0이다.
    Service:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - description
      - url
      - access
      - status
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        url:
          type: string
          format: uri
        access:
          type: string
          enum:
          - public
          - sso
          - admin
        roles:
          type: array
          items:
            type: string
        status:
          type: string
          enum:
          - available
          - degraded
          - unknown
          description: 'EndpointSlice에 준비된 엔드포인트가 있으면 available, Service는 있으나 준비된

            엔드포인트가 없으면 degraded, 조회 권한이 없거나 클러스터 밖에서 실행 중이면 unknown이다.

            '
    Template:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - exposure
      - description
      - valuesFile
      properties:
        id:
          type: string
          enum:
          - web-public-v2
          - web-oidc-v2
        name:
          type: string
        exposure:
          type: string
          enum:
          - public
          - oidc
        description:
          type: string
        valuesFile:
          type: string
    ResourcePreset:
      type: object
      additionalProperties: false
      required:
      - requests
      - limits
      properties:
        requests:
          $ref: '#/components/schemas/ResourceValues'
        limits:
          $ref: '#/components/schemas/ResourceValues'
    ResourceValues:
      type: object
      additionalProperties:
        type: string
    Exposure:
      description: '노출 방식. external 이면 Service + HTTPRoute + 외부 도메인을,

        internal 이면 Service 만 만든다(같은 AppGroup Namespace 안에서 Service DNS 로만 접근).


        예전 클라이언트를 위해 "public"/"oidc" 문자열도 받는다.

        public -> {mode: external} + authentication.mode=none

        oidc   -> {mode: external} + authentication.mode=oidc

        '
      oneOf:
      - type: object
        additionalProperties: false
        required:
        - mode
        properties:
          mode:
            type: string
            enum:
            - external
            - internal
      - type: string
        deprecated: true
        enum:
        - public
        - oidc
    Authentication:
      type: object
      additionalProperties: false
      description: 접속 인증. oidc 는 exposure.mode=external 에서만 쓸 수 있다.
      properties:
        mode:
          type: string
          enum:
          - none
          - oidc
          default: none
    AppPeer:
      type: object
      additionalProperties: false
      description: 같은 AppGroup 안의 앱 하나. raw label 대신 앱 이름만 받는다.
      required:
      - app
      properties:
        app:
          type: string
          pattern: ^[a-z]([-a-z0-9]*[a-z0-9])?$
          maxLength: 40
        protocol:
          type: string
          enum:
          - TCP
          default: TCP
        port:
          type: integer
          minimum: 0
          maximum: 65535
          description: 'egress에서는 1~65535 값이 필수다. ingress에서는 생략하거나 0으로 보내면

            현재 앱의 Service 포트를 쓰며 정규화 응답에도 0으로 나타날 수 있다.

            '
    CIDRPeer:
      type: object
      additionalProperties: false
      required:
      - cidr
      - port
      properties:
        cidr:
          type: string
          description: IPv4 또는 IPv6 CIDR. 전체 대역을 뜻하는 /0은 거부한다.
        protocol:
          type: string
          enum:
          - TCP
          - UDP
          default: TCP
        port:
          type: integer
          minimum: 1
          maximum: 65535
    NetworkPolicyInput:
      type: object
      additionalProperties: false
      description: allowedApps, allowedCIDRs, ingress.allowedApps를 합쳐 최대 20개 규칙을 받는다.
      properties:
        egressMode:
          type: string
          description: "blocked = DNS 와 아래에 적은 내부 앱만.\nweb     = 위 + 인터넷 TCP 80/443\
            \ (사설망/클러스터 대역은 ipBlock.except 로 제외).\n          URL/FQDN 단위 허용이 아니다.\n\
            custom  = 위 + allowedCIDRs 에 적은 목적지.\n"
          enum:
          - blocked
          - web
          - custom
          default: blocked
        allowedApps:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/AppPeer'
        allowedCIDRs:
          description: egressMode=custom 에서만 쓸 수 있다. IPv4와 IPv6 모두 전체 대역(/0)은 거부한다.
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/CIDRPeer'
        ingress:
          type: object
          additionalProperties: false
          properties:
            allowedApps:
              type: array
              maxItems: 20
              items:
                $ref: '#/components/schemas/AppPeer'
    AppProfileInput:
      type: object
      additionalProperties: false
      required:
      - appName
      - project
      - environment
      - containerPort
      - exposure
      - resourceSize
      properties:
        appName:
          type: string
          minLength: 1
          maxLength: 40
          pattern: ^[a-z]([-a-z0-9]*[a-z0-9])?$
        group:
          type: string
          description: AppGroup(Stack) 이름. 지정하면 app-<group> Namespace 에 배포된다.
          maxLength: 40
          pattern: ^[a-z]([-a-z0-9]*[a-z0-9])?$
        project:
          type: string
          description: Catalog.projects에 포함된 프로젝트
        environment:
          type: string
          description: Catalog.environment와 같은 현재 배포 환경
        gitRepository:
          description: 소스에서 빌드할 때 필요하다. image 를 지정하면 비워야 한다.
          type: string
          format: uri
          pattern: ^https://
        branch:
          type: string
          maxLength: 128
        dockerfile:
          type: string
          default: Dockerfile
        image:
          description: '이미 만들어진 이미지(postgres:16 등). 지정하면 소스 빌드를 하지 않는다.

            latest/main/master/stable 같은 가변 태그는 거부한다.

            '
          type: string
        containerPort:
          type: integer
          minimum: 1
          maximum: 65535
          default: 8080
        exposure:
          $ref: '#/components/schemas/Exposure'
        authentication:
          $ref: '#/components/schemas/Authentication'
        networkPolicy:
          $ref: '#/components/schemas/NetworkPolicyInput'
        resourceSize:
          type: string
          enum:
          - small
          - medium
        replicas:
          type: integer
          minimum: 1
          maximum: 5
          default: 1
          description: 앱 Pod 수. 생략하면 1이다.
        envVars:
          type: array
          maxItems: 100
          description: '단일 앱의 환경변수 입력. configmap 값은 정규화 응답과 Git values에 남는다.

            openbao 값은 생성 요청 처리 중 OpenBao에만 기록되고 응답·저장소·Git에는

            key 이름만 남는다. 검증 API는 값을 저장하지 않는다.

            '
          items:
            $ref: '#/components/schemas/EnvVarInput'
    EnvVarInput:
      type: object
      additionalProperties: false
      required:
      - key
      - classification
      properties:
        key:
          type: string
          maxLength: 128
          pattern: ^[A-Za-z_][A-Za-z0-9_]*$
        value:
          type: string
          maxLength: 4096
          description: openbao 분류에서는 필수이며 request-only다. 응답에는 포함되지 않는다.
        classification:
          type: string
          enum:
          - configmap
          - openbao
    AppGroupInput:
      type: object
      additionalProperties: false
      oneOf:
      - required:
        - compose
      - required:
        - repository
      required:
      - group
      - project
      - environment
      - resourceSize
      properties:
        group:
          type: string
          maxLength: 40
          pattern: ^[a-z]([-a-z0-9]*[a-z0-9])?$
        project:
          type: string
          description: Catalog.projects에 포함된 프로젝트
        environment:
          type: string
          description: Catalog.environment와 같은 현재 배포 환경
        compose:
          type: string
          description: 'docker-compose 문서 원본. 지원하지 않는 문법(anchor, 블록 스칼라, 여러 문서)과

            network_mode/privileged/host·bind mount 같은 키는 거부한다. 포트가 없는 서비스는

            Service/수신 probe 없는 worker가 되며, 빈 named volume은 플랫폼 계약의 RWO PVC가 된다.

            build는 credential 격리를 보장할 수 없어 거부하며 고정 tag/digest image만 허용한다.

            '
        repository:
          type: string
          format: uri
          maxLength: 2048
          description: 'Portal에 설정된 Forgejo의 HTTPS 저장소 주소. URL credential/query/fragment는

            허용하지 않는다. 기본 브랜치의 루트 Compose/Chart를 우선하고, 같은 우선순위의 후보가

            여러 개면 임의 선택하지 않고 422를 반환한다. Helm은 기본 values로 렌더한 단일 컨테이너

            Deployment와 단일 TCP Service만 변환하며 원본 RBAC/Secret/볼륨은 적용하지 않는다.

            '
        repositoryRevision:
          type: string
          pattern: ^[a-f0-9]{40}([a-f0-9]{24})?$
          description: '첫 Git 검증 응답의 source.revision. 생략하면 기본 브랜치의 현재 commit을

            선택하고, 있으면 같은 commit을 재검증·제출해 TOCTOU를 막는다.

            '
        resourceSize:
          type: string
          enum:
          - small
          - medium
        services:
          description: 'Compose 서비스별 노출, 인증, 네트워크, 자원, OpenBao key 이름 설정.

            허용 서비스 수 상한은 Catalog.appGroups.maxServices를 따른다.

            '
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - name
            properties:
              name:
                type: string
                maxLength: 40
                pattern: ^[a-z]([-a-z0-9]*[a-z0-9])?$
              secretKeys:
                type: array
                maxItems: 100
                uniqueItems: true
                description: 'OpenBao에 관리자가 미리 준비한 Secret key 이름만 선언한다. 실제 값은

                  이 요청에 넣지 않는다. Compose environment는 전부 거부되며, 서비스당

                  최대 100개의 key 이름만 선언할 수 있다.

                  '
                items:
                  type: string
                  maxLength: 128
                  pattern: ^[A-Za-z_][A-Za-z0-9_]*$
              exposure:
                $ref: '#/components/schemas/Exposure'
              authentication:
                $ref: '#/components/schemas/Authentication'
              networkPolicy:
                $ref: '#/components/schemas/NetworkPolicyInput'
              resourceSize:
                type: string
                enum:
                - small
                - medium
              replicas:
                type: integer
                minimum: 1
                maximum: 5
                default: 1
    AppGroupRef:
      type: object
      additionalProperties: false
      required:
      - name
      - namespace
      - project
      - environment
      properties:
        name:
          type: string
        namespace:
          type: string
        project:
          type: string
        environment:
          type: string
    AppGroupPlan:
      type: object
      additionalProperties: false
      required:
      - valid
      - group
      - source
      - services
      - warnings
      - quota
      properties:
        valid:
          type: boolean
          const: true
        group:
          $ref: '#/components/schemas/AppGroupRef'
        source:
          $ref: '#/components/schemas/AppGroupSource'
        services:
          type: array
          items:
            $ref: '#/components/schemas/AppProfileValidation'
        warnings:
          type: array
          items:
            type: string
        quota:
          $ref: '#/components/schemas/QuotaSummary'
    AppGroupSource:
      type: object
      additionalProperties: false
      required:
      - type
      properties:
        type:
          type: string
          enum:
          - compose
          - helm
        repository:
          type: string
          format: uri
        revision:
          type: string
        path:
          type: string
    AppGroupCreated:
      type: object
      additionalProperties: false
      required:
      - group
      - requests
      - count
      properties:
        group:
          $ref: '#/components/schemas/AppGroupRef'
        requests:
          type: array
          items:
            $ref: '#/components/schemas/DeploymentRequest'
        count:
          type: integer
    AppProfileValidation:
      type: object
      additionalProperties: false
      required:
      - valid
      - profile
      - generated
      - nextSteps
      - warnings
      properties:
        valid:
          type: boolean
          const: true
        profile:
          $ref: '#/components/schemas/NormalizedProfile'
        generated:
          $ref: '#/components/schemas/GeneratedPlan'
        nextSteps:
          type: array
          items:
            type: string
        warnings:
          type: array
          items:
            type: string
    NormalizedProfile:
      type: object
      additionalProperties: false
      required:
      - app
      - source
      - service
      - exposure
      - authentication
      - networkPolicy
      - configuration
      - resources
      - replicas
      - quota
      - persistence
      properties:
        app:
          type: object
          additionalProperties: false
          required:
          - name
          - project
          - environment
          properties:
            name:
              type: string
            group:
              type: string
            project:
              type: string
            environment:
              type: string
        source:
          type: object
          additionalProperties: false
          required:
          - repository
          - revision
          - dockerfile
          - context
          properties:
            repository:
              type: string
            revision:
              type: string
              description: 사용자가 선택한 추적 branch
            commit:
              type: string
              pattern: ^[a-f0-9]{40}([a-f0-9]{24})?$
              description: Forgejo에서 확인해 실제 image build에 고정한 source commit
            dockerfile:
              type: string
            context:
              type: string
              description: Dockerfile의 COPY/ADD 기준 디렉터리. 현재 단일 앱 source build의 저장소
                루트(.)로 고정되며 입력으로 지정할 수 없다.
            image:
              type: string
        service:
          type: object
          additionalProperties: false
          required:
          - enabled
          - port
          - healthPath
          properties:
            enabled:
              type: boolean
              description: false면 포트 없는 worker라 Service/HTTPRoute/수신 probe를 만들지 않는다.
            port:
              type: integer
              minimum: 0
            healthPath:
              type: string
            internalAddress:
              type: string
              description: 'Service가 있는 워크로드의 클러스터 내부 주소다. 실제 ClusterIP가 아니라

                재배포에도 유지되는 `<service>.<namespace>.svc:<port>` 형식의 Kubernetes Service

                DNS이며, Service를 만들지 않는 worker 응답에는 없다.

                '
        persistence:
          type: object
          additionalProperties: false
          required:
          - enabled
          properties:
            enabled:
              type: boolean
            mountPath:
              type: string
            size:
              type: string
              description: 플랫폼 AppGroup storage 계약이 정한 서비스별 크기다.
            storageClass:
              type: string
              description: 플랫폼 계약의 허용 StorageClass다.
        exposure:
          type: object
          additionalProperties: false
          required:
          - mode
          - type
          properties:
            mode:
              type: string
              enum:
              - external
              - internal
            type:
              description: 예전 화면과 저장된 신청 기록을 위한 호환 값이다. 새 로직은 mode 를 본다.
              type: string
              enum:
              - public
              - oidc
              - internal
            host:
              description: external 전용. internal 앱에는 없다.
              type: string
        authentication:
          type: object
          additionalProperties: false
          required:
          - mode
          properties:
            mode:
              type: string
              enum:
              - none
              - oidc
        networkPolicy:
          type: object
          additionalProperties: false
          required:
          - egressMode
          - ingress
          properties:
            egressMode:
              type: string
              enum:
              - blocked
              - web
              - custom
            allowedApps:
              type: array
              items:
                $ref: '#/components/schemas/AppPeer'
            allowedCIDRs:
              type: array
              items:
                $ref: '#/components/schemas/CIDRPeer'
            ingress:
              type: object
              additionalProperties: false
              properties:
                allowedApps:
                  type: array
                  items:
                    $ref: '#/components/schemas/AppPeer'
        configuration:
          type: object
          additionalProperties: false
          required:
          - config
          - secretKeys
          properties:
            config:
              type: object
              description: ConfigMap으로 렌더되는 비민감 환경변수. 값이 응답과 Git values에 남는다.
              additionalProperties:
                type: string
            secretKeys:
              type: array
              description: 'ExternalSecret이 OpenBao에서 읽을 key 이름만 포함한다. envVars의

                classification=openbao 값 자체는 정규화 응답에 절대 포함하지 않는다.

                '
              uniqueItems: true
              items:
                type: string
        resources:
          $ref: '#/components/schemas/ResourcePreset'
        replicas:
          type: integer
          minimum: 1
          maximum: 5
        quota:
          $ref: '#/components/schemas/QuotaSummary'
    GeneratedPlan:
      type: object
      additionalProperties: false
      required:
      - valuesTemplate
      - openbaoPath
      - expectedAnonymousStatus
      properties:
        valuesTemplate:
          type: string
        openbaoPath:
          type: string
        keycloakClientId:
          type: string
        oidcCallbackUrl:
          type: string
          format: uri
        image:
          type: string
          description: 미리 빌드된 입력 이미지는 즉시 채워지고, 소스 빌드 이미지는 빌드 완료 뒤 채워진다.
        expectedAnonymousStatus:
          description: 내부 전용 앱은 외부 경로가 없어 0 이다.
          type: integer
          enum:
          - 0
          - 200
          - 302
    DeploymentRequestInput:
      description: 배포 요청 본문은 validate와 완전히 같은 스키마이다. 알 수 없는 필드는 400이다.
      $ref: '#/components/schemas/AppProfileInput'
    RuntimeStateInput:
      type: object
      additionalProperties: false
      required:
      - state
      properties:
        state:
          type: string
          enum:
          - running
          - stopped
          description: stopped는 Pod와 외부 Route를 내리고, running은 신청 당시 replica와 Route를
            복원한다.
    PullRequestRef:
      type: object
      additionalProperties: false
      required:
      - number
      - url
      - branch
      - state
      properties:
        number:
          type: integer
          description: Forgejo Pull Request 번호
        url:
          type: string
          format: uri
        branch:
          type: string
          description: 봇이 만든 소스 브랜치
        state:
          type: string
          description: Forgejo가 보고한 Pull Request 상태
    DeploymentRequest:
      type: object
      additionalProperties: false
      required:
      - id
      - state
      - createdAt
      - updatedAt
      - profile
      - generated
      properties:
        id:
          type: string
          pattern: ^[0-9a-f]{16}$
        state:
          type: string
          enum:
          - received
          - pr-creating
          - pr-open
          - merged
          - building
          - deploying
          - deployed
          - stopping
          - stopped
          - starting
          - deleting
          - deleted
          - failed
          description: 'received는 저장 완료, pr-creating/pr-open/merged는 GitOps PR 단계,

            building은 이미지 빌드, deploying은 Argo CD rollout 대기, deployed는 대상 Namespace
            배포 완료,

            stopping/stopped/starting은 Service와 PVC를 보존한 실행 상태 전환이며,

            deleting/deleted는 소유자가 요청한 GitOps 리소스 삭제 단계, failed는 자동 처리 중 실패한 상태다.

            '
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        requester:
          type: string
          description: 포털 세션에서 얻은 신청자. 클라이언트가 지정할 수 없다.
        profile:
          $ref: '#/components/schemas/NormalizedProfile'
        generated:
          $ref: '#/components/schemas/GeneratedPlan'
        pullRequest:
          $ref: '#/components/schemas/PullRequestRef'
        message:
          type: string
          description: 실패 사유 등 사람이 읽는 설명
        attempts:
          type: integer
          description: 워커가 시도한 횟수
        deletionRequested:
          type: boolean
          description: 이 요청이 앱 삭제 작업으로 전환된 적이 있는지 여부
        sourceUpdate:
          type: boolean
          description: 등록한 Forgejo source branch의 새 commit 감지로 자동 생성된 재배포 요청인지 여부
        gitCommitted:
          type: boolean
          description: 이 프로필의 desired state가 Forgejo target branch에 반영됐는지 여부
        desiredRevision:
          type: string
          description: Argo CD가 관찰해야 하는 target branch revision
        applicationSynced:
          type: boolean
          description: 앱 Application이 desiredRevision을 Synced 상태로 관찰했는지 여부
        failedFromState:
          type: string
          description: failed 직전 상태. merge 전 실패와 적용 후 실패를 구분하는 복구 checkpoint
        groupCleanupDecided:
          type: boolean
          description: AppGroup 마지막 앱 cleanup 범위를 원자적으로 결정했는지 여부
        groupCleanupPlanned:
          type: boolean
          description: 이 삭제에서 AppGroup Namespace bootstrap도 함께 정리하는지 여부
        desiredRuntimeState:
          type: string
          enum:
          - running
          - stopped
          description: 생략된 구버전 요청은 running이다. 중지/재개 GitOps 전환의 목표 상태다.
        runtimeGeneration:
          type: integer
          minimum: 0
          description: 같은 요청의 stop/start PR branch를 구분하는 단조 증가 세대
        runtimePullRequest:
          $ref: '#/components/schemas/PullRequestRef'
        runtimeSupersededPullRequest:
          $ref: '#/components/schemas/PullRequestRef'
        runtimeDesiredRevision:
          type: string
          description: stop/start에서 Argo CD가 관찰해야 하는 target branch revision
        runtimeApplicationSynced:
          type: boolean
          description: 앱 Application이 runtimeDesiredRevision을 Synced 상태로 관찰했는지 여부
        secretWritePending:
          type: boolean
          description: 요청은 durable하지만 OpenBao Secret 쓰기가 아직 확인되지 않아 GitOps 처리를 시작하지
            않은 상태
    DeploymentRequestList:
      type: object
      additionalProperties: false
      required:
      - items
      - count
      - limit
      - requester
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DeploymentRequest'
        count:
          type: integer
        limit:
          type: integer
        requester:
          type: string
          description: BFF가 세션에서 주입한 X-Portal-User 신청자
    Problem:
      type: object
      additionalProperties: true
      required:
      - type
      - title
      - status
      - detail
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        errors:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - field
            - message
            properties:
              field:
                type: string
              message:
                type: string
